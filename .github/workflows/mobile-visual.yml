name: EcoScan Mobile Visual Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend for phone viewports
        run: npm run build
      - name: Install Playwright
        run: python -m pip install playwright
      - name: Run responsive screenshots and layout checks
        run: python scripts/mobile-visual-audit.py
      - name: Upload phone screenshots and visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecoscan-mobile-visual-report
          path: mobile-audit/
          if-no-files-found: warn
          retention-days: 7
