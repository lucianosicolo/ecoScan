name: EcoScan Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check pinned Android package metadata
        run: npm view @capacitor/android@7.1.0 dist.integrity dist.tarball peerDependencies --json
      - name: Install dependencies
        run: npm ci
      - name: Compile production app
        run: npm run build
      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
