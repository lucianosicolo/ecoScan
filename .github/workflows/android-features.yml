name: EcoScan Android Feature Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-features.yml'
      - 'scripts/android-feature-backend.py'
      - 'scripts/android-feature-smoke.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-features:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install frontend
        run: npm ci
      - name: Compile Angular
        run: npm run build
      - name: Synchronize Capacitor Android
        run: npx cap sync android
      - name: Build native debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test login scan gallery camera map on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front none
          script: bash scripts/android-feature-smoke.sh
      - name: Upload native feature screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecoscan-android-feature-test
          path: android-feature-audit/
          if-no-files-found: warn
          retention-days: 7
